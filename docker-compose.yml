version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: codician_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '#boney@6264464754'
      MYSQL_DATABASE: 'codician_db'
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codician_backend
    restart: always
    environment:
      - DB_HOST=db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codician_frontend
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
